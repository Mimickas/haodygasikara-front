# =============================================================================
#  Haodygasikara — site et API sous le MÊME domaine
# =============================================================================
#  À copier dans /etc/nginx/sites-available/haodygasikara, puis :
#    sudo ln -s /etc/nginx/sites-available/haodygasikara /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d test.haodygasikara.com      # HTTPS (Let's Encrypt)
#
#  Remplacer test.haodygasikara.com par le domaine du serveur de test.
#
#  Pourquoi un seul domaine : le site appelle l'API sur « /api » (même
#  origine). Aucun réglage CORS, et le cookie de session (SameSite=Strict,
#  chemin /api/auth/refresh) reste un cookie « maison » que le navigateur
#  renvoie sans discuter.
# =============================================================================

server {
    listen 80;
    server_name test.haodygasikara.com;

    # Le site : le build de Vite (npm run build), copié ici
    root /var/www/haodygasikara;
    index index.html;

    # Les photos et vidéos passent par Cloudinary, pas par ce serveur ; seuls
    # les envois de formulaires transitent. 20 Mo laisse de la marge.
    client_max_body_size 20m;

    # L'API Spring Boot, écoutée en local seulement (port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le PDF d'un devis et le recalcul des associations peuvent prendre
        # quelques secondes
        proxy_read_timeout 60s;
    }

    # Les fichiers du build portent une empreinte dans leur nom : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application à page unique : toute autre adresse (/circuit/12, /mes-devis…)
    # renvoie index.html, et le routeur React affiche la bonne page — ou la 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
